AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KASANE COLLECTIVE event brief API

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]+$'
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://swirawan.github.io
  AllowedOriginsEnv:
    Type: String
    Default: https://swirawan.github.io
    Description: Same origins as AllowedOrigins, comma-separated, used by Lambda validation.
  CaptchaRequired:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  TurnstileExpectedHostnames:
    Type: String
    Default: swirawan.github.io,kasanecollective.com,www.kasanecollective.com
  TurnstileExpectedAction:
    Type: String
    Default: kasane_brief
  EmailEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  FromEmail:
    Type: String
    Default: hello@example.com
  NotificationEmails:
    Type: String
    Default: ''
    Description: Comma-separated recipient addresses for KASANE lead notifications.
  LeadRetentionDays:
    Type: Number
    Default: 730
    MinValue: 30
    MaxValue: 3650

  AdminAllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173,https://swirawan.github.io
    Description: Origins allowed to call the KASANE Admin API.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref StageName
        LOG_LEVEL: INFO

Resources:
  BriefApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  BriefFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Description: Validates CAPTCHA, stores KASANE event briefs, and sends SES notifications.
      Environment:
        Variables:
          TABLE_NAME: !Ref LeadsTable
          ALLOWED_ORIGINS: !Ref AllowedOriginsEnv
          CAPTCHA_REQUIRED: !Ref CaptchaRequired
          TURNSTILE_SECRET_ARN: !Ref TurnstileSecret
          TURNSTILE_EXPECTED_HOSTNAMES: !Ref TurnstileExpectedHostnames
          TURNSTILE_EXPECTED_ACTION: !Ref TurnstileExpectedAction
          EMAIL_ENABLED: !Ref EmailEnabled
          FROM_EMAIL: !Ref FromEmail
          NOTIFICATION_EMAILS: !Ref NotificationEmails
          LEAD_RETENTION_DAYS: !Ref LeadRetentionDays
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeadsTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource: !GetAtt LeadsTable.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref TurnstileSecret
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${FromEmail}
      Events:
        SubmitBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref BriefApi
            Path: /v1/briefs
            Method: POST
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref BriefApi
            Path: /health
            Method: GET

  LeadsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reference
          AttributeType: S
      KeySchema:
        - AttributeName: reference
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ========================================================
  # PHASE 6 — KASANE OPERATIONS PLATFORM
  # ========================================================

  AdminApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  AdminApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName

      CorsConfiguration:
        AllowOrigins: !Ref AdminAllowedOrigins
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 600

      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40

      AccessLogSettings:
        DestinationArn: !GetAtt AdminApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'

      Auth:
        DefaultAuthorizer: StaffJwtAuthorizer

        Authorizers:
          StaffJwtAuthorizer:
            IdentitySource: $request.header.Authorization

            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${StaffUserPool}

              audience:
                - !Ref StaffUserPoolClient


  StaffUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      UserPoolName: !Sub kasane-staff-${StageName}

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3

      MfaConfiguration: OPTIONAL

      EnabledMfas:
        - SOFTWARE_TOKEN_MFA

      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email


  StaffUserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    Properties:
      UserPoolId: !Ref StaffUserPool
      ClientName: !Sub kasane-admin-${StageName}

      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30

      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days


  StaffOwnerGroup:
    Type: AWS::Cognito::UserPoolGroup

    Properties:
      UserPoolId: !Ref StaffUserPool
      GroupName: OWNER
      Description: KASANE owner with full platform authority.
      Precedence: 0


  StaffManagerGroup:
    Type: AWS::Cognito::UserPoolGroup

    Properties:
      UserPoolId: !Ref StaffUserPool
      GroupName: MANAGER
      Description: KASANE operations manager.
      Precedence: 10


  StaffWorkerGroup:
    Type: AWS::Cognito::UserPoolGroup

    Properties:
      UserPoolId: !Ref StaffUserPool
      GroupName: WORKER
      Description: KASANE staff member. Project authority is assigned separately.
      Precedence: 20


  OpsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: !Sub kasane-ops-${StageName}
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S

        - AttributeName: SK
          AttributeType: S

        - AttributeName: GSI1PK
          AttributeType: S

        - AttributeName: GSI1SK
          AttributeType: S

        - AttributeName: GSI2PK
          AttributeType: S

        - AttributeName: GSI2SK
          AttributeType: S

        - AttributeName: GSI3PK
          AttributeType: S

        - AttributeName: GSI3SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH

        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      SSESpecification:
        SSEEnabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      TimeToLiveSpecification:
        AttributeName: ttlExpiresAt
        Enabled: true


  AdminFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: admin/
      Handler: app.handler
      Description: KASANE authenticated staff API.
      Timeout: 5

      Environment:
        Variables:
          OPS_TABLE_NAME: !Ref OpsTable
          STAFF_USER_POOL_ID: !Ref StaffUserPool
          STAGE: !Ref StageName

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OpsTable

      Events:
        CurrentStaffMember:
          Type: HttpApi

          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/me
            Method: GET


  TurnstileSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Cloudflare Turnstile secret for the KASANE public event brief form.
      SecretString: '{"secret":"REPLACE_ME"}'

Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL
    Value: !Sub https://${BriefApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}
  BriefEndpoint:
    Description: Put this value into frontend config.js as briefEndpoint
    Value: !Sub https://${BriefApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/v1/briefs
  HealthEndpoint:
    Value: !Sub https://${BriefApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/health
  LeadsTableName:
    Value: !Ref LeadsTable
  AdminApiBaseUrl:
    Description: KASANE staff Admin API base URL
    Value: !Sub https://${AdminApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}

  AdminMeEndpoint:
    Description: Authenticated staff identity endpoint
    Value: !Sub https://${AdminApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/v1/admin/me

  OpsTableName:
    Description: KASANE operations single table
    Value: !Ref OpsTable

  StaffUserPoolId:
    Description: KASANE staff Cognito User Pool
    Value: !Ref StaffUserPool

  StaffUserPoolClientId:
    Description: KASANE Admin application client
    Value: !Ref StaffUserPoolClient

  TurnstileSecretArn:
    Value: !Ref TurnstileSecret
