AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KASANE COLLECTIVE event brief API

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]+$'
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://swirawan.github.io
  AllowedOriginsEnv:
    Type: String
    Default: https://swirawan.github.io
    Description: Same origins as AllowedOrigins, comma-separated, used by Lambda validation.
  CaptchaRequired:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  TurnstileExpectedHostnames:
    Type: String
    Default: swirawan.github.io,kasanecollective.com,www.kasanecollective.com
  TurnstileExpectedAction:
    Type: String
    Default: kasane_brief
  EmailEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  FromEmail:
    Type: String
    Default: hello@example.com
  NotificationEmails:
    Type: String
    Default: ''
    Description: Comma-separated recipient addresses for KASANE lead notifications.
  LeadRetentionDays:
    Type: Number
    Default: 730
    MinValue: 30
    MaxValue: 3650

  AdminAllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173,https://swirawan.github.io
    Description: Origins allowed to call the KASANE Admin API.


  PortalAllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5174,https://portal-dev.kasanecollective.com
    Description: Origins allowed to call the KASANE Client Portal API.


  PreviewTokenSecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN used to sign protected DEV preview access.

  PreviewBaseUrl:
    Type: String
    Default: ''
    Description: Protected DEV preview site base URL.

Conditions:
  HasPreviewTokenSecret: !Not [!Equals [!Ref PreviewTokenSecretArn, '']]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref StageName
        LOG_LEVEL: INFO

Resources:
  BriefApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub kasane-public-${StageName}
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  BriefFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Description: Validates CAPTCHA, stores KASANE event briefs, and sends SES notifications.
      Environment:
        Variables:
          TABLE_NAME: !Ref LeadsTable
          OPS_TABLE_NAME: !Ref OpsTable
          OPS_STAFF_INDEX_NAME: GSI2
          ALLOWED_ORIGINS: !Ref AllowedOriginsEnv
          CAPTCHA_REQUIRED: !Ref CaptchaRequired
          TURNSTILE_SECRET_ARN: !Ref TurnstileSecret
          TURNSTILE_EXPECTED_HOSTNAMES: !Ref TurnstileExpectedHostnames
          TURNSTILE_EXPECTED_ACTION: !Ref TurnstileExpectedAction
          EMAIL_ENABLED: !Ref EmailEnabled
          FROM_EMAIL: !Ref FromEmail
          NOTIFICATION_EMAILS: !Ref NotificationEmails
          LEAD_RETENTION_DAYS: !Ref LeadRetentionDays
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeadsTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource: !GetAtt LeadsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${OpsTable.Arn}/index/GSI2'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref TurnstileSecret
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${FromEmail}
      Events:
        SubmitBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref BriefApi
            Path: /v1/briefs
            Method: POST
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref BriefApi
            Path: /health
            Method: GET

  LeadsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reference
          AttributeType: S
        - AttributeName: LeadIndexPK
          AttributeType: S
        - AttributeName: LeadIndexSK
          AttributeType: S

      KeySchema:
        - AttributeName: reference
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: LeadCreatedAtIndex
          KeySchema:
            - AttributeName: LeadIndexPK
              KeyType: HASH
            - AttributeName: LeadIndexSK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ========================================================
  # PHASE 6 — KASANE OPERATIONS PLATFORM
  # ========================================================

  AdminApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  AdminApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub kasane-admin-${StageName}
      StageName: !Ref StageName

      CorsConfiguration:
        AllowOrigins: !Ref AdminAllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 600

      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40

      AccessLogSettings:
        DestinationArn: !GetAtt AdminApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'

      Auth:
        DefaultAuthorizer: StaffJwtAuthorizer

        Authorizers:
          StaffJwtAuthorizer:
            IdentitySource: $request.header.Authorization

            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${StaffUserPool}

              audience:
                - !Ref StaffUserPoolClient


  StaffUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      UserPoolName: !Sub kasane-staff-${StageName}

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3

      MfaConfiguration: OPTIONAL

      EnabledMfas:
        - SOFTWARE_TOKEN_MFA

      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email


  StaffUserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    Properties:
      UserPoolId: !Ref StaffUserPool
      ClientName: !Sub kasane-admin-${StageName}

      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30

      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days


  StaffOwnerGroup:
    Type: AWS::Cognito::UserPoolGroup

    Properties:
      UserPoolId: !Ref StaffUserPool
      GroupName: OWNER
      Description: KASANE owner with full platform authority.
      Precedence: 0


  StaffManagerGroup:
    Type: AWS::Cognito::UserPoolGroup

    Properties:
      UserPoolId: !Ref StaffUserPool
      GroupName: MANAGER
      Description: KASANE operations manager.
      Precedence: 10


  StaffWorkerGroup:
    Type: AWS::Cognito::UserPoolGroup

    Properties:
      UserPoolId: !Ref StaffUserPool
      GroupName: WORKER
      Description: KASANE staff member. Project authority is assigned separately.
      Precedence: 20


  OpsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: !Sub kasane-ops-${StageName}
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S

        - AttributeName: SK
          AttributeType: S

        - AttributeName: GSI1PK
          AttributeType: S

        - AttributeName: GSI1SK
          AttributeType: S

        - AttributeName: GSI2PK
          AttributeType: S

        - AttributeName: GSI2SK
          AttributeType: S

        - AttributeName: GSI3PK
          AttributeType: S

        - AttributeName: GSI3SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH

        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      SSESpecification:
        SSEEnabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      TimeToLiveSpecification:
        AttributeName: ttlExpiresAt
        Enabled: true


  AdminFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: admin/
      Handler: app.handler
      Description: KASANE authenticated staff API.
      Timeout: 5

      Environment:
        Variables:
          OPS_TABLE_NAME: !Ref OpsTable
          LEADS_TABLE_NAME: !Ref LeadsTable
          STAFF_USER_POOL_ID: !Ref StaffUserPool
          STAGE: !Ref StageName
          PREVIEW_TOKEN_SECRET_ARN: !Ref PreviewTokenSecretArn
          PREVIEW_BASE_URL: !Ref PreviewBaseUrl

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OpsTable

        - DynamoDBReadPolicy:
            TableName: !Ref LeadsTable

        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminUserGlobalSignOut
              Resource: !GetAtt StaffUserPool.Arn

        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasPreviewTokenSecret
                - !Ref PreviewTokenSecretArn
                - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:kasane-preview-disabled

      Events:
        CurrentStaffMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/me
            Method: GET

        PreviewAccess:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/preview-access
            Method: POST

        UpdateCurrentStaffPreferences:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/me/preferences
            Method: PATCH

        ListLeads:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/leads
            Method: GET

        GetLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/leads/{reference}
            Method: GET

        ChangeLeadStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/leads/{reference}/status
            Method: PATCH

        ConvertLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/leads/{reference}/convert
            Method: POST

        ListProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects
            Method: GET

        GetProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}
            Method: GET

        UpdateProjectColor:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/color
            Method: PATCH

        UpdateProjectScope:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/scope
            Method: PATCH

        CompleteProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/complete
            Method: POST

        ReopenProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/reopen
            Method: POST

        ArchiveProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/archive
            Method: POST

        RestoreProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/restore
            Method: POST

        CancelProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/cancel
            Method: POST

        ListFollowUps:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/follow-ups
            Method: GET

        ListProjectNotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/notes
            Method: GET

        CreateProjectNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/notes
            Method: POST

        UpdateProjectNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/notes/{noteId}
            Method: PATCH

        ListProjectFollowUps:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/follow-ups
            Method: GET

        CreateProjectFollowUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/follow-ups
            Method: POST

        UpdateProjectFollowUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/follow-ups/{followUpId}
            Method: PATCH

        ListProjectActivity:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/activity
            Method: GET

        ListTasks:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/tasks
            Method: GET

        ListProjectTasks:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/tasks
            Method: GET

        CreateProjectTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/tasks
            Method: POST

        UpdateProjectTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/tasks/{taskId}
            Method: PATCH

        ListProjectMembers:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/members
            Method: GET

        AssignProjectMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/members
            Method: POST

        ChangeProjectMemberRole:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/members/{userId}/role
            Method: PATCH

        UnassignProjectMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/members/{userId}
            Method: DELETE

        ListProjectVendors:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/vendors
            Method: GET

        LinkProjectVendor:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/vendors
            Method: POST

        UpdateProjectVendor:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/vendors/{vendorId}
            Method: PATCH

        UnlinkProjectVendor:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/projects/{projectId}/vendors/{vendorId}
            Method: DELETE

        ListVendors:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/vendors
            Method: GET

        CreateVendor:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/vendors
            Method: POST

        GetVendor:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/vendors/{vendorId}
            Method: GET

        UpdateVendor:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/vendors/{vendorId}
            Method: PATCH

        StaffDirectory:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/directory
            Method: GET

        ListStaff:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/staff
            Method: GET

        CreateStaff:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/staff
            Method: POST

        ChangeStaffRole:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/staff/{userId}/role
            Method: PATCH

        ChangeStaffStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminApi
            Path: /v1/admin/staff/{userId}/status
            Method: PATCH


  # ========================================================
  # PHASE 7 — KASANE CLIENT PORTAL
  # ========================================================

  PortalApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30


  ClientUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      UserPoolName: !Sub kasane-client-${StageName}

      UserPoolTier: ESSENTIALS

      UsernameAttributes:
        - email

      UsernameConfiguration:
        CaseSensitive: false

      AutoVerifiedAttributes:
        - email

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
            - EMAIL_OTP

      MfaConfiguration: 'OFF'

      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT

      EmailAuthenticationSubject: Your KASANE sign-in code

      EmailAuthenticationMessage: >-
        Your KASANE sign-in code is {####}.
        Enter this code to access your event portal.

      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email


  ClientUserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    Properties:
      UserPoolId: !Ref ClientUserPool
      ClientName: !Sub kasane-portal-${StageName}

      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      AccessTokenValidity: 30
      IdTokenValidity: 30
      RefreshTokenValidity: 7

      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days


  PortalApi:
    Type: AWS::Serverless::HttpApi

    Properties:
      Name: !Sub kasane-portal-${StageName}
      StageName: !Ref StageName

      CorsConfiguration:
        AllowOrigins: !Ref PortalAllowedOrigins

        AllowMethods:
          - GET
          - OPTIONS

        AllowHeaders:
          - authorization
          - content-type

        MaxAge: 600

      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

      AccessLogSettings:
        DestinationArn: !GetAtt PortalApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'

      Auth:
        DefaultAuthorizer: ClientJwtAuthorizer

        Authorizers:
          ClientJwtAuthorizer:
            IdentitySource: $request.header.Authorization

            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${ClientUserPool}

              audience:
                - !Ref ClientUserPoolClient


  PortalFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: portal/
      Handler: app.handler
      Description: KASANE authenticated client portal read API.
      Timeout: 5

      Environment:
        Variables:
          OPS_TABLE_NAME: !Ref OpsTable
          STAGE: !Ref StageName

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OpsTable

      Events:
        CurrentClient:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /v1/client/me
            Method: GET

        ListClientProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /v1/client/projects
            Method: GET

        GetClientProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /v1/client/projects/{projectId}
            Method: GET


  TurnstileSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Cloudflare Turnstile secret for the KASANE public event brief form.
      SecretString: '{"secret":"REPLACE_ME"}'

Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL
    Value: !Sub https://${BriefApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}
  BriefEndpoint:
    Description: Put this value into frontend config.js as briefEndpoint
    Value: !Sub https://${BriefApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/v1/briefs
  HealthEndpoint:
    Value: !Sub https://${BriefApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/health
  LeadsTableName:
    Value: !Ref LeadsTable
  AdminApiBaseUrl:
    Description: KASANE staff Admin API base URL
    Value: !Sub https://${AdminApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}

  AdminMeEndpoint:
    Description: Authenticated staff identity endpoint
    Value: !Sub https://${AdminApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/v1/admin/me

  OpsTableName:
    Description: KASANE operations single table
    Value: !Ref OpsTable

  StaffUserPoolId:
    Description: KASANE staff Cognito User Pool
    Value: !Ref StaffUserPool

  StaffUserPoolClientId:
    Description: KASANE Admin application client
    Value: !Ref StaffUserPoolClient
  PortalApiId:
    Description: KASANE Client Portal HTTP API ID
    Value: !Ref PortalApi

  PortalApiBaseUrl:
    Description: KASANE Client Portal API base URL
    Value: !Sub https://${PortalApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}

  ClientUserPoolId:
    Description: KASANE client Cognito User Pool
    Value: !Ref ClientUserPool

  ClientUserPoolClientId:
    Description: KASANE Client Portal application client
    Value: !Ref ClientUserPoolClient


  TurnstileSecretArn:
    Value: !Ref TurnstileSecret
